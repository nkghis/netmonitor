spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:netwatch}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:netwatch}
    password: ${DB_PASSWORD:netwatch123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  thymeleaf:
    cache: false
    encoding: UTF-8

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    whitelabel:
      enabled: false

# Application settings
netwatch:
  jwt:
    secret: ${JWT_SECRET:NetWatch2024SecureKeyForJWTTokenGenerationAtLeast256BitsLong!}
    expiration: 86400000  # 24 hours in ms

  monitoring:
    ping-interval-seconds: ${PING_INTERVAL:60}       # Intervalle de ping en secondes
    timeout-ms: ${PING_TIMEOUT:5000}                  # Timeout ping en ms
    alert-threshold: ${ALERT_THRESHOLD:3}             # Nb d'échecs consécutifs avant alerte
    recovery-check-count: ${RECOVERY_CHECK:2}         # Nb de succès avant marquage "recovered"

  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    # CallMeBot API (gratuit pour WhatsApp)
    callmebot-api-url: https://api.callmebot.com/whatsapp.php

  notifications:
    from-name: "NetWatch Monitor - Ivoire Cartes Systems"
    subject-prefix: "[NetWatch]"
    degraded-enabled: ${DEGRADED_NOTIFICATIONS_ENABLED:false}

logging:
  level:
    com.netwatch: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
