<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWatch — Connexion</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --border: #1e293b;
            --accent: #3b82f6;
            --accent-glow: rgba(59,130,246,0.3);
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --muted: #64748b;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            overflow: hidden;
        }

        /* Background grid effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* Glow orbs */
        body::after {
            content: '';
            position: fixed;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
            top: -200px; left: -200px;
            pointer-events: none;
        }

        .orb2 {
            position: fixed;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(16,185,129,0.06) 0%, transparent 70%);
            bottom: -100px; right: -100px;
            pointer-events: none;
            border-radius: 50%;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
            font-size: 20px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
            font-family: 'SF Pro Display', 'Segoe UI', sans-serif;
        }

        .brand h1 span { color: var(--accent); }

        .brand-sub {
            color: var(--muted);
            font-size: 13px;
            font-family: sans-serif;
        }

        /* Ping indicators animation */
        .ping-indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0;
        }

        .ping-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        .ping-dot:nth-child(1) { background: var(--green); animation-delay: 0s; }
        .ping-dot:nth-child(2) { background: var(--green); animation-delay: 0.2s; }
        .ping-dot:nth-child(3) { background: #f59e0b; animation-delay: 0.4s; }
        .ping-dot:nth-child(4) { background: var(--green); animation-delay: 0.6s; }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 14px;
            color: var(--muted);
            font-family: sans-serif;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 8px;
            font-family: sans-serif;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: monospace;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: sans-serif;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #2563eb;
            box-shadow: 0 4px 20px var(--accent-glow);
            transform: translateY(-1px);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            font-family: sans-serif;
        }

        .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }

        .footer-note {
            text-align: center;
            color: var(--muted);
            font-size: 11px;
            margin-top: 24px;
            font-family: sans-serif;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 11px;
            color: var(--muted);
        }

        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s infinite; }
    </style>
</head>
<body>
    <div class="orb2"></div>

    <div class="login-container">
        <div class="brand">
            <div class="brand-logo">
                <div class="logo-icon">📡</div>
                <h1>Net<span>Watch</span></h1>
            </div>
            <p class="brand-sub">Surveillance de Connexions Internet — Ivoire Cartes Systèmes</p>
            <div class="ping-indicators">
                <div class="ping-dot"></div>
                <div class="ping-dot"></div>
                <div class="ping-dot"></div>
                <div class="ping-dot"></div>
            </div>
        </div>

        <div class="card">
            <p class="card-title">// Authentification requise</p>

            <div th:if="${error}" class="alert alert-error">
                <strong>⚠</strong> <span th:text="${error}">Erreur</span>
            </div>
            <div th:if="${message}" class="alert alert-success">
                <strong>✓</strong> <span th:text="${message}">Message</span>
            </div>

            <form method="post" th:action="@{/login}">
                <div class="form-group">
                    <label for="username">Identifiant</label>
                    <input type="text" id="username" name="username"
                           placeholder="admin" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login">
                    → Accéder au tableau de bord
                </button>
            </form>

            <div class="status-bar">
                <div class="status-dot"></div>
                Système de monitoring de lien internet
            </div>
        </div>

        <p class="footer-note">
            NetWatch v1.0 · Ivoire Cartes Systèmes · Ghislain N'KAGOU ·
        </p>
    </div>
</body>
</html>
